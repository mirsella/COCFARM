plugins {
    id 'com.android.application' version '9.4.0'
}

def assets = layout.buildDirectory.dir('generated/runnerAssets')
android {
    namespace = 'org.cocfarm.marble'
    compileSdk = 36

    defaultConfig {
        applicationId = 'org.cocfarm.marble'
        minSdk = 33
        targetSdk = 35
        versionCode = 1
        versionName = '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(assets.get().asFile)
}

tasks.register('stageRunnerAssets', Sync) {
    into assets
    from('../../templates/builder') {
        include 'battle.png', 'find_now.png', 'marble_attack_cooldown.png', 'battle_starts.png', 'battle_ends.png',
                'return_home.png', 'cart_world.png', 'cart_world/*.png', 'cart_title.png', 'cart_collect.png',
                'cart_close.png', 'storage_hud.png', 'hero_machine.png', 'hero_copter.png', 'power_pekka.png',
                'marble_attacker.png', 'marble_defender.png', 'speed_1x.png'
        into 'builder'
    }
    from('../..') {
        include 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'licenses/Apache-2.0.txt'
        into 'notices'
    }
}
tasks.named('preBuild') { dependsOn 'stageRunnerAssets' }

dependencies {
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
